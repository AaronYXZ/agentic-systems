[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-systems-course"
version = "0.1.0"
description = "A hands-on path from agent fundamentals to production-minded agentic systems."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "python-dotenv>=1.0,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    "ruff>=0.11,<1.0",
]

[project.scripts]
first-graph = "agentic_systems.first_graph:main"
first-agent = "agentic_systems.first_agent:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_systems"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]


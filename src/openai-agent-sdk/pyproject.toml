[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openai-agent-sdk-job-search"
version = "0.1.0"
description = "A local job search agent learning project using the OpenAI Agents SDK."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai-agents>=0.22,<1",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["openai_agent_sdk"]

[tool.hatch.build.targets.wheel.force-include]
"data/jobs.json" = "openai_agent_sdk/data/jobs.json"
